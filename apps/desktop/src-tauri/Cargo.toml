[package]
name = "ai-recorder-desktop"
version = "0.1.1"
description = "AI Recorder desktop application"
authors = ["you"]
edition = "2021"

[lib]
name = "ai_recorder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
hound = "3"
xcap = "0.4.1"
sysinfo = "0.29"
reqwest = { version = "0.12", default-features = true, features = ["json", "multipart"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
core-foundation = "0.10"
objc2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics"] }
block2 = "0.6.1"
dispatch2 = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
